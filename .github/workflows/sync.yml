name: 同步上游模板更新
on:
  schedule:
    - cron: "0 0 * * *"  # 每天自动同步
  workflow_dispatch:     # 支持手动同步

# 开启写入权限（解决128错误）
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 配置Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: 同步上游仓库 (sansan0/TrendRadar)
        run: |
          # 添加原项目为上游
          git remote add upstream https://github.com/sansan0/TrendRadar.git
          # 拉取上游代码
          git fetch upstream
          # 合并上游master分支
          git merge upstream/master --allow-unrelated-histories -X theirs
          # 推送到自己的仓库
          git push https://${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:master
